services:

  # -----------------------------------------
  # Ollama
  # -----------------------------------------
  ollama:
    image: ollama/ollama
    container_name: ollama
    # No host port published: the API currently uses the host-installed Ollama on 11434
    # (OLLAMA_HOST=host.docker.internal), which would conflict. If you want to use this
    # container instead, set OLLAMA_HOST=ollama on brain-api and publish "127.0.0.1:11434:11434".
    volumes:
      - ollama-data:/root/.ollama
      - ./ollama/llm_models:/workspace/llm_models
    # Optional: only used if brain-api is switched to OLLAMA_HOST=ollama (see README).
    # For NVIDIA GPU acceleration add a "deploy" block here (see README).
    restart: unless-stopped
    networks:
      - brain-net

  # -----------------------------------------
  # Vector Database
  # -----------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: open-brain-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - brain-net

  # -----------------------------------------
  # Brain API (FastAPI)
  # Handles ingest + semantic search
  # Talks to Ollama (embeddings) + Qdrant (storage)
  # -----------------------------------------
  brain-api:
    build:
      context: ./brain-api
      dockerfile: Dockerfile
    container_name: open-brain-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Browser origins allowed to call the API (comma-separated). Must match the web UI URL.
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_LLM_MODEL=qwen3:14b
      - COLLECTION_NAME=brain
      # Cosine score at or above which a new entry counts as a duplicate (>1 disables)
      - DEDUP_THRESHOLD=0.92
      # Seconds to wait for the LLM metadata call (cold model loads can be slow)
      - METADATA_TIMEOUT=60
    depends_on:
      - qdrant
      - ollama
    networks:
      - brain-net

  # -----------------------------------------
  # MCP Server (Python, FastMCP)
  # Exposes brain to Claude Code via MCP protocol
  # -----------------------------------------
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: open-brain-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - BRAIN_API_URL=http://brain-api:8000
    depends_on:
      - brain-api
    networks:
      - brain-net

  # -----------------------------------------
  # Web UI (React + Vite)
  # Browser-based capture and search interface
  # -----------------------------------------
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: open-brain-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    environment:
      - BRAIN_API_URL=http://localhost:8000
    depends_on:
      - brain-api
    networks:
      - brain-net

  # -----------------------------------------
  # Open WebUI
  # Browser-based chat UI for Ollama models
  # -----------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - brain-net

volumes:
  ollama-data:
  open-webui-data:
  qdrant_data:
    driver: local

networks:
  brain-net:
    driver: bridge
